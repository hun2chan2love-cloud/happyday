<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해피데이 다이어리</title>
<meta name="theme-color" content="#fbf8f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">

<style>
:root{
  --paper:#fbf8f1; --sheet:#fffdf8; --ink:#2b2f3a; --ink-soft:#6b6f7a;
  --rule:#e4dccb; --blue:#2f4f86; --done:#3d7a5a; --later:#b9832b; --miss:#a9473f;
  --marker:#fff1a8; --tab:#ebe4d4;
  --f-display:"Gowun Batang",serif; --f-body:"Gowun Dodum",system-ui,sans-serif; --f-hand:"Nanum Pen Script",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1d1f24; --sheet:#25282e; --ink:#e9e5dc; --ink-soft:#a3a39c; --rule:#3a3d44;
  --blue:#8fb0e8; --done:#7cc49c; --later:#e2b467; --miss:#e08a82; --marker:#5a5122; --tab:#30333a; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.page{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 동기화 상태 */
.sync{display:flex;justify-content:center}
.sync button{font-size:.78rem;color:var(--ink-soft);border:1px solid var(--rule);border-radius:20px;padding:3px 12px;display:inline-flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule);display:inline-block}
.sync[data-s="ok"] i{background:var(--done)}
.sync[data-s="busy"] i{background:var(--later)}
.sync[data-s="warn"] button{color:var(--miss);border-color:var(--miss)}
.sync[data-s="warn"] i{background:var(--miss)}

/* 날짜 */
.date{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date h1{margin:0;text-align:center;line-height:1.25;position:relative}
.date h1 button{font-family:var(--f-display);font-weight:700;font-size:1.55rem}
.date h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--ink-soft);letter-spacing:.04em}
#picker{position:absolute;inset:0;opacity:0;pointer-events:none}
.arrow{width:40px;height:40px;border-radius:50%;font-size:1.3rem;color:var(--ink-soft);flex-shrink:0}
.arrow:hover{background:var(--tab)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.8rem}
.week button{padding:6px 0;border-radius:8px;color:var(--ink-soft);font-variant-numeric:tabular-nums;position:relative}
.week button b{display:block;font-size:1rem;color:var(--ink)}
.week button.real::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue)}
.week button.sel{background:var(--ink);color:var(--paper)}
.week button.sel b{color:var(--paper)}
.today-link{font-size:.8rem;color:var(--blue);text-align:center;margin-top:-10px}

/* 섹션 */
.sec h2{font-family:var(--f-display);font-size:1.05rem;margin:0 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2 span{font-family:var(--f-body);font-size:.78rem;color:var(--ink-soft);font-weight:400;text-align:right}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}

/* 주간 메모 */
details.memo{background:var(--tab);border-radius:6px;padding:10px 14px}
details.memo summary{cursor:pointer;font-family:var(--f-display);font-weight:700;list-style:none;display:flex;gap:10px;align-items:baseline}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary::after{content:"펼치기";font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--ink-soft);flex-shrink:0}
details.memo[open] summary::after{content:"접기"}
.peek{font-family:var(--f-body);font-weight:400;color:var(--ink-soft);font-size:.85rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-grid{display:grid;gap:10px;margin-top:10px}
.memo-grid label{font-size:.8rem;color:var(--ink-soft);letter-spacing:.04em}
.memo-grid textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);padding:8px 10px;font:inherit}

/* 어제 기억할 것 */
.yesterday{background:var(--marker);padding:12px 16px;border-radius:2px;transform:rotate(-.6deg);box-shadow:0 2px 0 var(--rule)}
.yesterday p{margin:0;font-family:var(--f-hand);font-size:1.45rem;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.yesterday small{display:block;font-size:.75rem;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:2px}

/* 공통 줄 항목 */
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.edit{flex:1;min-width:8em;border:0;background:transparent;font:inherit;color:inherit;padding:4px 0}
.edit::placeholder{color:var(--ink-soft)}
.empty{padding:10px 12px;color:var(--ink-soft);font-size:.85rem;border-bottom:1px solid var(--rule)}
.add{display:flex;gap:8px;padding:6px 10px;min-height:44px;align-items:center}
.add input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink)}
.add input::placeholder{color:var(--ink-soft)}
.add button{color:var(--blue);font-size:.85rem;padding:6px 4px}

/* 할 일 */
.task[data-s="done"] .edit{text-decoration:line-through;text-decoration-color:var(--done);color:var(--ink-soft)}
.task[data-s="later"] .edit{color:var(--ink-soft)}
.seg{display:flex;border:1px solid var(--rule);border-radius:20px;overflow:hidden;flex-shrink:0;margin-left:auto}
.seg button{font-size:.75rem;padding:5px 9px;color:var(--ink-soft)}
.seg button+button{border-left:1px solid var(--rule)}
.task[data-s="done"] .seg [data-v="done"]{background:var(--done);color:var(--sheet)}
.task[data-s="miss"] .seg [data-v="miss"]{background:var(--miss);color:var(--sheet)}
.task[data-s="later"] .seg [data-v="later"]{background:var(--later);color:var(--sheet)}
.tally{font-variant-numeric:tabular-nums}

/* 감사일기 */
.thanks{counter-reset:t}
.thanks .row{counter-increment:t;padding-left:12px}
.thanks .row::before{content:counter(t);font-family:var(--f-display);color:var(--blue);width:1em;flex-shrink:0;align-self:flex-start;padding-top:9px}
textarea.grow{resize:none;overflow:hidden;display:block;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.add textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;line-height:1.5;padding:4px 0}
.add textarea::placeholder{color:var(--ink-soft)}
textarea.edit{line-height:1.5}
.thanks .edit,#thxForm textarea{font-family:var(--f-hand);font-size:1.4rem;line-height:1.5}

/* 기억할 것 */
.lined{background-color:var(--sheet);background-image:repeating-linear-gradient(transparent 0 43px,var(--rule) 43px 44px);background-attachment:local}
.rem .edit,#remForm textarea{font-family:var(--f-hand);font-size:1.4rem;line-height:1.5}
.row.long .edit{flex-basis:100%}
.row.long{padding-bottom:8px}
.rem .row{padding-left:12px}
.carry{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-soft);flex-shrink:0;cursor:pointer;margin-left:auto}
.carry input{width:20px;height:20px;accent-color:var(--blue);margin:0;cursor:pointer}
.carry:has(input:checked){color:var(--blue)}
.hint{font-size:.78rem;color:var(--ink-soft);margin:6px 2px 0}

/* 습관표 */
.habit-wrap{overflow-x:auto}
table.habit{width:100%;border-collapse:collapse;font-size:.85rem}
.habit th,.habit td{border-bottom:1px solid var(--rule);text-align:center;height:42px;padding:0 1px}
.habit thead th{font-family:var(--f-display);font-weight:400;color:var(--ink-soft);background:var(--tab)}
.habit thead th:first-child{text-align:left;padding-left:10px}
.habit thead th.now{color:var(--ink);font-weight:700}
.habit td.name{text-align:left;padding:0 6px 0 10px;min-width:6.5em}
.habit td.name input{width:100%;border:0;background:transparent;font:inherit;color:inherit}
.habit td.now{background:color-mix(in srgb,var(--marker) 55%,transparent)}
.habit tr:last-child td{border-bottom:0}
.shot-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:130px;border:1.5px dashed var(--rule);border-radius:6px;color:var(--ink-soft);cursor:pointer;font-size:.9rem;background:var(--sheet)}
.shot-empty b{font-size:1.6rem;font-weight:400;line-height:1;color:var(--blue)}
.shot{margin:0;background:var(--sheet);border:1px solid var(--rule);padding:10px 10px 4px;box-shadow:0 2px 0 var(--rule);transform:rotate(.5deg)}
.shot-frame{position:relative;background:var(--tab);min-height:120px}
.shot img{display:block;width:100%;max-height:440px;object-fit:cover}
.shot-frame p{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:.85rem;color:var(--ink-soft);text-align:center;padding:12px}
.shot figcaption{display:flex;justify-content:flex-end;gap:14px;padding:6px 2px;font-size:.82rem;color:var(--ink-soft)}
.shot figcaption label{cursor:pointer}
.ask{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ask p{margin:0}
.ask-t{font-family:var(--f-display);font-weight:700}
.ask-l{font-size:.85rem;color:var(--ink-soft);overflow-wrap:anywhere}
.ask-b{display:flex;gap:8px;margin-top:6px}
.ask-b button{flex:1;border:1px solid var(--rule);border-radius:20px;padding:8px 0;font-size:.9rem}
.ask-b .pri{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:inline-grid;place-items:center;font-size:.8rem}
.dot.on{background:var(--blue);border-color:var(--blue);color:var(--sheet)}

/* 하단 도구 */
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px dashed var(--rule);padding-top:14px}
.tools button,.tools label{border:1px solid var(--rule);border-radius:20px;padding:6px 14px;font-size:.82rem;color:var(--ink-soft);cursor:pointer}
.foot{font-size:.75rem;color:var(--ink-soft);text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:.85rem;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="sync" id="sync" data-s="off"><button type="button" id="syncBtn"><i></i><span id="syncTxt">구글 드라이브 연결하기</span></button></div>

  <header class="date">
    <button class="arrow" id="prev" aria-label="전날">‹</button>
    <h1><small id="dateSub"></small><button type="button" id="dateBtn"></button><input type="date" id="picker" tabindex="-1" aria-hidden="true"></h1>
    <button class="arrow" id="next" aria-label="다음 날">›</button>
  </header>
  <nav class="week" id="week" aria-label="이번 주"></nav>
  <button type="button" class="today-link" id="goToday" hidden>오늘로 돌아가기</button>

  <details class="memo" id="memo">
    <summary>주간 메모 <span class="peek" id="peek"></span></summary>
    <div class="memo-grid">
      <div><label for="mThis">이번 주</label><textarea id="mThis" placeholder="이번 주에 챙길 것"></textarea></div>
      <div><label for="mNext">다음 주</label><textarea id="mNext" placeholder="다음 주로 넘길 것 (다음 주 '이번 주' 칸에 자동으로 옮겨져요)"></textarea></div>
    </div>
  </details>

  <div class="yesterday" id="yest" hidden>
    <small>어제 적어 둔 기억할 것</small>
    <p id="yestTxt"></p>
  </div>

  <section class="sec">
    <h2>오늘 할 일 <span class="tally" id="tally"></span></h2>
    <div class="box">
      <ul class="rows" id="tasks"></ul>
      <form class="add" id="taskForm"><textarea id="taskIn" class="grow" rows="1" placeholder="할 일 추가" aria-label="할 일 추가"></textarea><button>추가</button></form>
    </div>
  </section>

  <section class="sec">
    <h2>감사 일기</h2>
    <div class="box">
      <ul class="rows thanks" id="thanks"></ul>
      <form class="add" id="thxForm"><textarea id="thxIn" class="grow" rows="1" placeholder="+ 한 줄 더 쓰기" aria-label="감사 한 줄 추가"></textarea><button>추가</button></form>
    </div>
  </section>

  <section class="sec remember">
    <h2>기억할 것</h2>
    <div class="box">
      <ul class="rows rem" id="rems"></ul>
      <form class="add" id="remForm"><textarea id="remIn" class="grow" rows="1" placeholder="+ 기억할 것 쓰기" aria-label="기억할 것 추가"></textarea><button>추가</button></form>
    </div>
  </section>

  <section class="sec">
    <h2>오늘의 한 컷</h2>
    <label class="shot-empty" id="photoEmpty" for="photoIn"><b>＋</b>사진 넣기</label>
    <figure class="shot" id="photoFull" hidden>
      <div class="shot-frame"><img id="photoImg" alt="오늘의 사진"><p id="photoMsg" hidden>드라이브에 연결하면 사진이 보여요</p></div>
      <figcaption><label for="photoIn">바꾸기</label><button type="button" id="photoDel">빼기</button></figcaption>
    </figure>
    <input type="file" id="photoIn" accept="image/*" hidden>
  </section>

  <section class="sec">
    <h2>이번 주 습관</h2>
    <div class="box ask" id="habitAsk" hidden>
      <p class="ask-t" id="askTitle"></p>
      <p class="ask-l" id="askList"></p>
      <div class="ask-b"><button type="button" class="pri" id="askKeep">이어서 쓰기</button><button type="button" id="askNew">새로 시작</button></div>
    </div>
    <div class="box habit-wrap"><table class="habit" id="habit"></table></div>
    <form class="add" id="habitForm" style="padding-inline:2px"><input id="habitIn" placeholder="+ 습관 추가" aria-label="습관 추가" autocomplete="off"><button>추가</button></form>
  </section>

  <div class="tools">
    <button type="button" id="xlsBtn">이번 주 엑셀로 내보내기</button>
    <button type="button" id="bakBtn">백업 파일 저장</button>
    <label for="restore">백업 불러오기</label><input type="file" id="restore" accept="application/json,.json" hidden>
  </div>
  <p class="foot">항목 글자를 누르면 고칠 수 있고, 글자를 모두 지우면 항목이 삭제돼요.<br>화면을 좌우로 밀면 날짜가 바뀌어요.</p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ───────── 날짜 도우미 ───────── */
const DOW=["일","월","화","수","목","금","토"], WD=["월","화","수","목","금","토","일"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const monday=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};
const todayKey=()=>ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function weekNo(s){const d=parse(s);const t=new Date(d);t.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

/* ───────── 저장소 ───────── */
const KEY="happyday-v1";
let DB={days:{},weeks:{},meta:{exported:{}}};
try{const raw=localStorage.getItem(KEY);if(raw)DB=Object.assign(DB,JSON.parse(raw));}catch(e){}
DB.meta=DB.meta||{};DB.meta.exported=DB.meta.exported||{};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}Drive.schedule();}

let cur=todayKey();
/* 기억할 것: [{id,t,c}] — c가 체크되면 다음 날 할 일로 들어감 (예전 글 형식은 줄 단위로 바꿈) */
function norm(d){if(d&&!Array.isArray(d.remember))d.remember=String(d.remember||"").split("\n").map(t=>t.trim()).filter(Boolean).map(t=>({id:uid(),t,c:0}));return d;}
function normAll(db){for(const k in (db.days||{}))norm(db.days[k]);return db;}
normAll(DB);
function day(k=cur,create){let d=DB.days[k];if(!d&&create){d=DB.days[k]={tasks:[],thanks:[],remember:[],u:0};}return d||{tasks:[],thanks:[],remember:[],u:0};}
/* 체크한 기억할 것 ↔ 다음 날 할 일 연결 */
function syncCarry(k,item){
  const nk=addDays(k,1), nd=day(nk,true), i=nd.tasks.findIndex(t=>t.from===item.id);
  if(item.c&&item.t){if(i<0)nd.tasks.push({id:uid(),t:item.t,s:"",from:item.id});else nd.tasks[i].t=item.t;}
  else if(i>=0)nd.tasks.splice(i,1);
  nd.u=Date.now();
}
function touchDay(k=cur){const d=day(k,true);d.u=Date.now();persist();}
/* 주 기록: 아직 없으면 지난 주에서 습관 목록과 '다음 주' 메모를 이어받은 기본값을 보여 주고,
   실제로 고칠 때 저장함 (미리 넘겨 본 주가 지난 주 변경을 놓치지 않도록) */
const views={};
function week(m=monday(cur)){
  if(DB.weeks[m])return DB.weeks[m];
  const prevKeys=Object.keys(DB.weeks).filter(k=>k<m).sort(), pk=prevKeys[prevKeys.length-1], p=pk?DB.weeks[pk]:null;
  const v=views[m]||(views[m]={memoThis:"",memoNext:"",habits:[],u:0});
  v.memoThis=v._edited?v.memoThis:(p&&pk===addDays(m,-7)?(p.memoNext||""):"");
  /* 습관은 바로 이어받지 않고, 지난 목록을 pending에 두었다가 '이어서 쓰기/새로 시작'을 고르게 함 */
  if(!v._edited){const src=p?(p.habits.length?p.habits.map(h=>h.n):(p.pending||[])):[];v.habits=[];v.pending=src.length?src:null;}
  return v;
}
function weekEdit(m=monday(cur)){const w=week(m);if(!DB.weeks[m]){w._edited=true;DB.weeks[m]=w;}return w;}
function touchWeek(m=monday(cur)){const w=weekEdit(m);delete w._edited;w.u=Date.now();persist();}

/* ───────── 화면 그리기 ───────── */
const $=id=>document.getElementById(id);
const LBL={done:"완료",miss:"미완료",later:"연기"};
function render(){
  const d=parse(cur), m=monday(cur), t=todayKey();
  $("dateSub").textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 · ${weekNo(cur)}주차`;

function fit(t){

  const row=t.closest(".task,.rem .row");
  if(row&&t.classList.contains("edit")){

    row.classList.remove("long");size();

    if(t.scrollHeight>lh*2+10){row.classList.add("long");size();}

}

  catch(err){toast("백업 파일을 읽지 못했어요. happyday 백업 파일(.json)인지 확인해 주세요.");}

};
/* 기록 합치기: 날짜·주 단위로 더 최근에 고친 쪽을 남김 */
function merge(inc,preferInc,union){
  let changed=false;
  const cat=(x,y)=>!x?y:!y||x===y?x:(x.includes(y)?x:y.includes(x)?y:x+"\n"+y);
  normAll(inc);
  for(const sec of ["days","weeks"]){for(const k in (inc[sec]||{})){const a=DB[sec][k],b=inc[sec][k];
    if(a&&union){
      /* 이 기기에서 드라이브에 처음 연결할 때: 어느 쪽 기록도 지우지 않고 합침 */
      const before=JSON.stringify(a);
      if(sec==="days"){
        b.tasks.forEach(t=>{if(!a.tasks.some(x=>x.id===t.id||x.t===t.t))a.tasks.push(t);});
        b.thanks.forEach(t=>{if(!a.thanks.includes(t))a.thanks.push(t);});
        b.remember.forEach(t=>{if(!a.remember.some(x=>x.id===t.id||x.t===t.t))a.remember.push(t);});
        if(!a.photo&&b.photo)a.photo=b.photo;
      }else{
        b.habits.forEach(h=>{const x=a.habits.find(x=>x.n===h.n);if(x)x.c=x.c.map((v,i)=>v||h.c[i]?1:0);else a.habits.push(h);});
        if(a.habits.length)delete a.pending;a.memoThis=cat(a.memoThis,b.memoThis);a.memoNext=cat(a.memoNext,b.memoNext);
      }
      a.u=Math.max(a.u||0,b.u||0)+(JSON.stringify(a)!==before?1:0);
      changed=changed||JSON.stringify(a)!==before;
    }else if(!a||(b.u||0)>(a.u||0)||(preferInc&&(b.u||0)===(a.u||0))){DB[sec][k]=b;changed=true;}}}
  Object.assign(DB.meta.exported,(inc.meta&&inc.meta.exported)||{});
  return changed;
}

let xlsxReady;
function loadXlsx(){return xlsxReady||(xlsxReady=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s);}));}
async function weekXlsx(m){
  await loadXlsx();
  const w=DB.weeks[m]||{memoThis:"",memoNext:"",habits:[]}, end=addDays(m,6);
  const rows=[[`주간 스케줄러  ${m} ~ ${end}`],[],["이번 주",w.memoThis||""],["다음 주",w.memoNext||""],[]];
  for(let i=0;i<7;i++){const k=addDays(m,i),d=day(k),dt=parse(k);
    rows.push([`${WD[i]}요일  ${dt.getMonth()+1}/${dt.getDate()}`]);
    if(d.tasks.length)d.tasks.forEach(t=>rows.push(["",`${t.s==="done"?"☑":"☐"} ${t.t}`,LBL[t.s]||""]));else rows.push(["","(할 일 없음)"]);
    rows.push(["감사 일기",d.thanks.map((x,j)=>`${j+1}. ${x}`).join("\n")]);
    if(d.photo)rows.push(["오늘의 한 컷","사진 있음 (드라이브 happyday 다이어리 폴더)"]);
    rows.push(["기억할 것",d.remember.map(x=>(x.c?"→ ":"")+x.t).join("\n")]);rows.push([]);
  }
  rows.push(["습관",...WD]);
  (w.habits||[]).forEach(h=>rows.push([h.n,...h.c.map(v=>v?"○":"")]));
  const ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=[{wch:14},{wch:44},{wch:8},{wch:4},{wch:4},{wch:4},{wch:4},{wch:4}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"주간");
  return new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* ───────── 오늘의 한 컷 (사진은 이 기기 IndexedDB + 드라이브에 저장) ───────── */
const Photos=(()=>{
  let dbp,shownUrl=null,token=0;
  const idb=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open("happyday-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);}));
  async function put(id,blob){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction("p","readwrite");t.objectStore("p").put(blob,id);t.oncomplete=ok;t.onerror=()=>no(t.error);});}
  async function get(id){try{const d=await idb();return await new Promise(ok=>{const r=d.transaction("p").objectStore("p").get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null);});}catch(e){return null}}
  async function del(id){try{const d=await idb();d.transaction("p","readwrite").objectStore("p").delete(id);}catch(e){}}
  async function shrink(file){
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
      const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.82));
      if(!blob)throw new Error("encode");
      return {blob,w,h};
    }finally{URL.revokeObjectURL(url);}
  }
  async function show(){
    const my=++token, p=day().photo, img=$("photoImg");
    if(shownUrl){URL.revokeObjectURL(shownUrl);shownUrl=null;}
    $("photoEmpty").hidden=!!p; $("photoFull").hidden=!p; $("photoMsg").hidden=true; img.removeAttribute("src"); img.hidden=false;
    if(!p)return;
    img.style.aspectRatio=`${p.w}/${p.h}`;
    let b=await get(p.id);
    if(!b&&p.drive&&Drive.ready()){try{const r=await Drive.api(`https://www.googleapis.com/drive/v3/files/${p.drive}?alt=media`);b=await r.blob();await put(p.id,b);}catch(e){}}
    if(my!==token)return;
    if(b){shownUrl=URL.createObjectURL(b);img.src=shownUrl;}else{img.hidden=true;$("photoMsg").hidden=false;}
  }
  function trash(p){if(p.drive){(DB.meta.trash=DB.meta.trash||[]).push(p.drive);}del(p.id);}
  async function add(file){
    try{const {blob,w,h}=await shrink(file),id=uid()+uid();await put(id,blob);
      const d=day(cur,true);if(d.photo)trash(d.photo);d.photo={id,w,h,drive:null};touchDay();show();toast("사진을 넣었어요");}
    catch(e){toast("사진을 넣지 못했어요. 다른 사진으로 해 보세요.");}
  }
  function remove(){const d=day(cur,true);if(!d.photo)return;trash(d.photo);delete d.photo;touchDay();show();toast("사진을 뺐어요");}
  /* 동기화 때: 아직 안 올린 사진을 드라이브에 올리고, 뺀 사진은 드라이브 휴지통으로 */
  async function pushPending(upload,api){
    for(const k in DB.days){const p=DB.days[k].photo;
      if(p&&!p.drive){const b=await get(p.id);if(b){p.drive=await upload(`happyday-사진-${k}.jpg`,b,"image/jpeg");DB.days[k].u=Date.now();}}}
    const t=DB.meta.trash||[];
    while(t.length){try{await api(`https://www.googleapis.com/drive/v3/files/${t[0]}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({trashed:true})});}catch(e){if(e.message==="auth")throw e;}t.shift();}
  }
  $("photoIn").onchange=e=>{const f=e.target.files[0];if(f)add(f);e.target.value="";};
  $("photoDel").onclick=()=>{if(confirm("이 날의 사진을 뺄까요?"))remove();};
  return {show,pushPending};
})();

/* ───────── 구글 드라이브 동기화 ───────── */
const Drive=(()=>{
  const SCOPE="https://www.googleapis.com/auth/drive.file", FOLDER="happyday 다이어리", FILE="happyday-data.json";
  let token=null,exp=0,client=null,timer=null,busy=false,dirty=false;
  try{const t=JSON.parse(localStorage.getItem("happyday-token")||"null");if(t&&t.exp>Date.now()+60e3){token=t.v;exp=t.exp;}}catch(e){}
  const wasLinked=()=>{try{return localStorage.getItem("happyday-linked")==="1"}catch(e){return false}};
  const ready=()=>token&&Date.now()<exp-30e3;
  function status(s,txt){$("sync").dataset.s=s;$("syncTxt").textContent=txt;}
  function idle(){
    if(!window.HAPPYDAY_CLIENT_ID)return status("off","드라이브 연결 전 · 이 폰에만 저장 중");
    if(ready())return status("ok","드라이브와 동기화됨");
    if(wasLinked())return status("warn","드라이브 연결이 끝났어요 · 눌러서 다시 연결");
    status("off","구글 드라이브 연결하기");
  }
  function initClient(){
    if(client||!window.google||!google.accounts)return client;
    client=google.accounts.oauth2.initTokenClient({client_id:window.HAPPYDAY_CLIENT_ID,scope:SCOPE,callback:r=>{
      if(r.error){idle();return toast("드라이브 연결이 취소됐어요");}
      token=r.access_token;exp=Date.now()+(r.expires_in||3600)*1000;
      try{localStorage.setItem("happyday-token",JSON.stringify({v:token,exp}));localStorage.setItem("happyday-linked","1");}catch(e){}
      sync();
    }});
    return client;
  }
  function connect(){
    if(!window.HAPPYDAY_CLIENT_ID)return toast("아직 구글 연결 설정(Client ID)이 들어가지 않았어요");
    if(ready())return sync();
    if(!initClient())return toast("구글 로그인을 불러오는 중이에요. 잠시 후 다시 눌러 주세요.");
    client.requestAccessToken({prompt:wasLinked()?"":"consent"});
  }
  async function api(url,opt={}){
    const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+token,...(opt.headers||{})}});
    if(r.status===401){token=null;exp=0;try{localStorage.removeItem("happyday-token")}catch(e){}idle();throw new Error("auth");}
    if(!r.ok)throw new Error("http "+r.status);
    return r;
  }
  async function find(q){const r=await api("https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&q="+encodeURIComponent(q+" and trashed=false"));return (await r.json()).files[0];}
  async function folderId(){
    if(DB.meta.folderId)return DB.meta.folderId;
    let f=await find(`name='${FOLDER}' and mimeType='application/vnd.google-apps.folder'`);
    if(!f){const r=await api("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:FOLDER,mimeType:"application/vnd.google-apps.folder"})});f=await r.json();}
    return DB.meta.folderId=f.id;
  }
  async function upload(name,blob,mime,existingId){
    const fid=await folderId();
    if(existingId){await api(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":mime},body:blob});return existingId;}
    const meta={name,parents:[fid]}, fd=new FormData();
    fd.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));fd.append("file",blob);
    const r=await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:fd});
    return (await r.json()).id;
  }
  async function sync(){
    if(!ready()||busy){dirty=true;return idle();}
    busy=true;dirty=false;status("busy","동기화 중…");
    try{
      const fid=await folderId();
      let file=await find(`name='${FILE}' and '${fid}' in parents`);
      if(file){const r=await api(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`);
        const remote=await r.json(); if(merge(remote,false,!DB.meta.synced)){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){} render();}}
      await Photos.pushPending(upload,api);
      await upload(FILE,new Blob([JSON.stringify(DB)],{type:"application/json"}),"application/json",file&&file.id);
      DB.meta.synced=true;
      await weeklyExports();
      try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
      busy=false;idle();
      if(dirty)schedule();
    }catch(e){busy=false;if(e.message!=="auth")status("warn","동기화 실패 · 눌러서 다시 시도");}
  }
  /* 지난 주가 끝나면 그 주 엑셀을 드라이브에 자동 저장 */
  async function weeklyExports(){
    const thisMon=monday(todayKey());
    const all=new Set([...Object.keys(DB.weeks),...Object.keys(DB.days).filter(k=>DB.days[k].u).map(monday)]);
    const weeks=[...all].filter(m=>m<thisMon&&!DB.meta.exported[m]).sort().slice(-4);
    for(const m of weeks){const b=await weekXlsx(m);await uploadXlsx(m,b);}
  }
  async function uploadXlsx(m,blob){
    const name=`happyday-주간-${m}.xlsx`, fid=await folderId();
    const ex=await find(`name='${name}' and '${fid}' in parents`);
    await upload(name,blob,blob.type,ex&&ex.id); DB.meta.exported[m]=Date.now();
  }
  function schedule(){if(!ready())return idle();clearTimeout(timer);timer=setTimeout(sync,2500);}
  $("syncBtn").onclick=connect;
  window.addEventListener("load",()=>{initClient();idle();if(ready())sync();});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(cur!==todayKey()&&lastToday!==todayKey()){lastToday=todayKey();go(lastToday);}if(ready())sync();else idle();}});
  return {schedule,ready,uploadXlsx,idle,api};
})();
let lastToday=todayKey();

render();Drive.idle();
if(window.HAPPYDAY_CLIENT_ID){const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=()=>Drive.idle();document.head.appendChild(s);}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
